<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="AR Globe retro abstract art">
  <defs>
    <radialGradient id="ar-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#071b26"/>
      <stop offset="100%" stop-color="#020810"/>
    </radialGradient>
    <filter id="ar-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" fill="url(#ar-bg)"/>

  <!-- Isometric Matrix Grid -->
  <g stroke="#00e5ff" stroke-width="1" opacity="0.18">
    <line x1="0" y1="40" x2="640" y2="40"/>
    <line x1="0" y1="100" x2="640" y2="100"/>
    <line x1="0" y1="160" x2="640" y2="160"/>
    <line x1="0" y1="220" x2="640" y2="220"/>
    <line x1="0" y1="280" x2="640" y2="280"/>
    <line x1="0" y1="340" x2="640" y2="340"/>
    <line x1="80" y1="0" x2="80" y2="360"/>
    <line x1="180" y1="0" x2="180" y2="360"/>
    <line x1="280" y1="0" x2="280" y2="360"/>
    <line x1="380" y1="0" x2="380" y2="360"/>
    <line x1="480" y1="0" x2="480" y2="360"/>
    <line x1="580" y1="0" x2="580" y2="360"/>
  </g>

  <!-- AR Scanning Targets (Brackets) -->
  <g stroke="#00e5ff" stroke-width="3" fill="none" opacity="0.8">
    <path d="M160 100 h-40 v40"/>
    <path d="M480 100 h40 v40"/>
    <path d="M160 260 h-40 v-40"/>
    <path d="M480 260 h40 v-40"/>
  </g>

  <!-- Central Wireframe Globe -->
  <g transform="translate(320, 180)">
    <!-- Outer Glow & Rings -->
    <circle cx="0" cy="0" r="95" fill="none" stroke="#00e5ff" stroke-width="3" filter="url(#ar-glow)"/>
    <circle cx="0" cy="0" r="115" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.6"/>
    <circle cx="0" cy="0" r="130" fill="none" stroke="#00e5ff" stroke-width="1" opacity="0.3"/>

    <!-- Latitude / Longitude Ellipses -->
    <ellipse cx="0" cy="0" rx="95" ry="32" fill="none" stroke="#00e5ff" stroke-width="2" opacity="0.75"/>
    <ellipse cx="0" cy="0" rx="95" ry="64" fill="none" stroke="#00e5ff" stroke-width="2" opacity="0.55"/>
    <ellipse cx="0" cy="0" rx="40" ry="95" fill="none" stroke="#00e5ff" stroke-width="2" opacity="0.75"/>
    <ellipse cx="0" cy="0" rx="72" ry="95" fill="none" stroke="#00e5ff" stroke-width="2" opacity="0.55"/>
    <line x1="-95" y1="0" x2="95" y2="0" stroke="#00e5ff" stroke-width="2" opacity="0.8"/>
    <line x1="0" y1="-95" x2="0" y2="95" stroke="#00e5ff" stroke-width="2" opacity="0.8"/>

    <!-- Stylized Pixel Continents / Regions -->
    <polygon points="-50,-30 -30,-50 -10,-40 -20,-10 -45,-15" fill="#22c55e" opacity="0.85"/>
    <polygon points="10,-60 40,-45 50,-10 25,-15 15,-40" fill="#22c55e" opacity="0.85"/>
    <polygon points="20,10 60,15 45,55 15,40" fill="#22c55e" opacity="0.85"/>
    <polygon points="-65,10 -30,20 -35,55 -55,40" fill="#22c55e" opacity="0.85"/>

    <!-- Geo Beacons & Pins -->
    <circle cx="-32" cy="-32" r="5" fill="#ffeb3b" filter="url(#ar-glow)"/>
    <line x1="-32" y1="-32" x2="-32" y2="-54" stroke="#ffeb3b" stroke-width="2"/>
    <circle cx="36" cy="24" r="5" fill="#ff2a2a" filter="url(#ar-glow)"/>
    <line x1="36" y1="24" x2="36" y2="2" stroke="#ff2a2a" stroke-width="2"/>
  </g>

  <!-- Laser Scanline -->
  <line x1="120" y1="180" x2="520" y2="180" stroke="#ffeb3b" stroke-width="2" opacity="0.8" filter="url(#ar-glow)"/>

  <!-- HUD Text Elements -->
  <text x="50" y="55" font-family="'Courier New', monospace" font-size="12" fill="#22c55e" letter-spacing="2">AR.FOUNDATION // TRACKING: ACTIVE</text>
  <text x="590" y="55" font-family="'Courier New', monospace" font-size="12" fill="#00e5ff" text-anchor="end" letter-spacing="2">LAT 28.6 // LON 77.2</text>
  <text x="50" y="325" font-family="'Courier New', monospace" font-size="11" fill="#ffeb3b" letter-spacing="1">MESH_DETECTED // SURFACE_ANCHOR: OK</text>
</svg>
