<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Emory Cole retro abstract detective mystery art">
  <defs>
    <radialGradient id="ec-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1c1208"/>
      <stop offset="100%" stop-color="#070502"/>
    </radialGradient>
    <linearGradient id="ec-cone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffeb3b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffeb3b" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="ec-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" fill="url(#ec-bg)"/>

  <!-- Venetian Blind Slat Shadows -->
  <g fill="#050302" opacity="0.6">
    <rect x="0" y="20" width="640" height="14"/>
    <rect x="0" y="54" width="640" height="14"/>
    <rect x="0" y="88" width="640" height="14"/>
    <rect x="0" y="122" width="640" height="14"/>
    <rect x="0" y="156" width="640" height="14"/>
    <rect x="0" y="190" width="640" height="14"/>
    <rect x="0" y="224" width="640" height="14"/>
    <rect x="0" y="258" width="640" height="14"/>
    <rect x="0" y="292" width="640" height="14"/>
    <rect x="0" y="326" width="640" height="14"/>
  </g>

  <!-- Dramatic Detective Spotlight Beam -->
  <polygon points="120,0 260,0 520,360 280,360" fill="url(#ec-cone)"/>

  <!-- Rotating Cipher Rings Puzzle Abstract Art -->
  <g transform="translate(360, 180)" stroke="#ffb703" stroke-width="2" fill="none" opacity="0.85">
    <circle cx="0" cy="0" r="90" stroke-dasharray="14 10" filter="url(#ec-glow)"/>
    <circle cx="0" cy="0" r="68" stroke-dasharray="8 6"/>
    <circle cx="0" cy="0" r="46" stroke-dasharray="18 8"/>
    <circle cx="0" cy="0" r="24" stroke="#ff0055" stroke-width="3"/>
    
    <!-- Cipher Runes / Ticks -->
    <line x1="0" y1="-90" x2="0" y2="-80"/>
    <line x1="0" y1="90" x2="0" y2="80"/>
    <line x1="-90" y1="0" x2="-80" y2="0"/>
    <line x1="90" y1="0" x2="80" y2="0"/>
    <line x1="-64" y1="-64" x2="-56" y2="-56"/>
    <line x1="64" y1="64" x2="56" y2="56"/>
  </g>

  <!-- Magnifying Glass & Key Clue -->
  <g transform="translate(240, 170)">
    <!-- Glass Rim -->
    <circle cx="0" cy="0" r="64" fill="#ffb703" fill-opacity="0.12" stroke="#ffeb3b" stroke-width="5" filter="url(#ec-glow)"/>
    <!-- Glass Handle -->
    <line x1="-45" y1="45" x2="-95" y2="95" stroke="#ffeb3b" stroke-width="12" stroke-linecap="round"/>
    <line x1="-45" y1="45" x2="-95" y2="95" stroke="#d48b00" stroke-width="6" stroke-linecap="round"/>
    <!-- Clue Key Inside Glass -->
    <g transform="translate(4, -4) rotate(45)">
      <circle cx="0" cy="-14" r="12" fill="none" stroke="#ff0055" stroke-width="4"/>
      <rect x="-3" y="-2" width="6" height="34" fill="#ff0055"/>
      <rect x="3" y="16" width="10" height="5" fill="#ff0055"/>
      <rect x="3" y="25" width="8" height="5" fill="#ff0055"/>
    </g>
  </g>

  <!-- Crime Scene Tape Graphic -->
  <g transform="translate(-20, 310) rotate(-6)">
    <rect width="680" height="24" fill="#ffd84a" stroke="#000000" stroke-width="2"/>
    <text x="30" y="17" font-family="'Courier New', monospace" font-size="12" font-weight="900" fill="#000000" letter-spacing="4">CRIME SCENE // CLUE VERIFIED // EVIDENCE [PASS]</text>
  </g>

  <!-- HUD Reticle Elements -->
  <text x="50" y="55" font-family="'Courier New', monospace" font-size="12" fill="#ffb703" letter-spacing="2">CASE NO. 047 // EMORY COLE</text>
  <text x="590" y="55" font-family="'Courier New', monospace" font-size="12" fill="#ff0055" text-anchor="end" letter-spacing="2">360° PANORAMA</text>
</svg>
