<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Earth Match retro abstract match-3 arcade art">
  <defs>
    <radialGradient id="em-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#230a38"/>
      <stop offset="100%" stop-color="#080210"/>
    </radialGradient>
    <filter id="em-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" fill="url(#em-bg)"/>

  <!-- Arcade Neon Grid -->
  <g stroke="#ca6cff" stroke-width="1" opacity="0.2">
    <line x1="80" y1="0" x2="80" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="360"/>
    <line x1="240" y1="0" x2="240" y2="360"/>
    <line x1="320" y1="0" x2="320" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/>
    <line x1="480" y1="0" x2="480" y2="360"/>
    <line x1="560" y1="0" x2="560" y2="360"/>
    <line x1="0" y1="60" x2="640" y2="60"/>
    <line x1="0" y1="120" x2="640" y2="120"/>
    <line x1="0" y1="180" x2="640" y2="180"/>
    <line x1="0" y1="240" x2="640" y2="240"/>
    <line x1="0" y1="300" x2="640" y2="300"/>
  </g>

  <!-- Match-3 Combo Beam Laser -->
  <g filter="url(#em-glow)">
    <line x1="220" y1="180" x2="420" y2="180" stroke="#ffeb3b" stroke-width="8"/>
    <line x1="220" y1="180" x2="420" y2="180" stroke="#ffffff" stroke-width="4"/>
  </g>

  <!-- Combo Shockwave Ring -->
  <circle cx="320" cy="180" r="82" fill="none" stroke="#ff0055" stroke-width="2" stroke-dasharray="8 6" opacity="0.6"/>

  <!-- Gem Blocks Matrix -->
  <!-- Top Row -->
  <!-- Emerald Gem -->
  <polygon points="220,95 242,110 242,135 220,150 198,135 198,110" fill="#22c55e" stroke="#ffffff" stroke-width="2"/>
  <!-- Ruby Heart Gem -->
  <g transform="translate(320, 115) scale(1.1)">
    <path d="M0 -8 A7 7 0 0 0 -14 -8 Q-14 6 0 14 Q14 6 14 -8 A7 7 0 0 0 0 -8 Z" fill="#ef4444" stroke="#ffffff" stroke-width="2"/>
  </g>
  <!-- Sapphire Gem -->
  <polygon points="420,95 442,110 442,135 420,150 398,135 398,110" fill="#00e5ff" stroke="#ffffff" stroke-width="2"/>

  <!-- Middle Row (The Matched 3 Gold Stars) -->
  <!-- Gold Star 1 -->
  <g transform="translate(220, 180) scale(1.2)" filter="url(#em-glow)">
    <polygon points="0,-16 5,-5 16,-5 8,3 11,14 0,7 -11,14 -8,3 -16,-5 -5,-5" fill="#ffd84a" stroke="#ffffff" stroke-width="2"/>
  </g>
  <!-- Gold Star 2 (Center Combo) -->
  <g transform="translate(320, 180) scale(1.4)" filter="url(#em-glow)">
    <polygon points="0,-16 5,-5 16,-5 8,3 11,14 0,7 -11,14 -8,3 -16,-5 -5,-5" fill="#ffeb3b" stroke="#ffffff" stroke-width="2"/>
  </g>
  <!-- Gold Star 3 -->
  <g transform="translate(420, 180) scale(1.2)" filter="url(#em-glow)">
    <polygon points="0,-16 5,-5 16,-5 8,3 11,14 0,7 -11,14 -8,3 -16,-5 -5,-5" fill="#ffd84a" stroke="#ffffff" stroke-width="2"/>
  </g>

  <!-- Bottom Row -->
  <!-- Cyan Diamond -->
  <polygon points="220,225 242,245 220,265 198,245" fill="#00e5ff" stroke="#ffffff" stroke-width="2"/>
  <!-- Violet Hexagon -->
  <polygon points="320,225 342,240 342,260 320,275 298,260 298,240" fill="#a855f7" stroke="#ffffff" stroke-width="2"/>
  <!-- Ruby Gem -->
  <g transform="translate(420, 245) scale(1.1)">
    <path d="M0 -8 A7 7 0 0 0 -14 -8 Q-14 6 0 14 Q14 6 14 -8 A7 7 0 0 0 0 -8 Z" fill="#ef4444" stroke="#ffffff" stroke-width="2"/>
  </g>

  <!-- Side Floating Sparkles -->
  <polygon points="120,80 125,95 140,95 128,105 132,120 120,110 108,120 112,105 100,95 115,95" fill="#ffd84a" opacity="0.6"/>
  <polygon points="520,250 525,265 540,265 528,275 532,290 520,280 508,290 512,275 500,265 515,265" fill="#00e5ff" opacity="0.6"/>

  <!-- HUD Reticle Elements -->
  <text x="50" y="55" font-family="'Courier New', monospace" font-size="12" fill="#ffd84a" letter-spacing="2">MATCH-3 // CASCADE ENGINE</text>
  <text x="590" y="55" font-family="'Courier New', monospace" font-size="12" fill="#ef4444" text-anchor="end" letter-spacing="2">COMBO x3 // +9999 PTS</text>
</svg>
