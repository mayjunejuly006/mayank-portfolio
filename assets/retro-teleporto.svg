<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Teleporto retro abstract puzzle art">
  <defs>
    <radialGradient id="tp-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#190d33"/>
      <stop offset="100%" stop-color="#070312"/>
    </radialGradient>
    <filter id="tp-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" fill="url(#tp-bg)"/>

  <!-- Perspective Grid Lines -->
  <path d="M0 320 L640 320 M0 280 L640 280 M0 240 L640 240 M0 200 L640 200" stroke="#ca6cff" stroke-width="1" opacity="0.25"/>
  <path d="M320 160 L0 360 M320 160 L120 360 M320 160 L240 360 M320 160 L400 360 M320 160 L520 360 M320 160 L640 360" stroke="#ca6cff" stroke-width="1" opacity="0.22"/>

  <!-- Stars -->
  <rect x="70" y="45" width="4" height="4" fill="#ffeb3b" opacity="0.8"/>
  <rect x="540" y="75" width="4" height="4" fill="#00e5ff" opacity="0.8"/>
  <rect x="190" y="90" width="3" height="3" fill="#ffffff" opacity="0.7"/>
  <rect x="440" y="50" width="3" height="3" fill="#ff2a2a" opacity="0.8"/>
  <rect x="310" y="30" width="5" height="5" fill="#ffeb3b" opacity="0.9"/>

  <!-- Left Blue Portal -->
  <g transform="translate(170, 180) rotate(-15)">
    <ellipse cx="0" cy="0" rx="42" ry="92" fill="#00e5ff" opacity="0.18" filter="url(#tp-glow)"/>
    <ellipse cx="0" cy="0" rx="34" ry="80" fill="none" stroke="#00e5ff" stroke-width="6" filter="url(#tp-glow)"/>
    <ellipse cx="0" cy="0" rx="22" ry="64" fill="#061226"/>
    <ellipse cx="0" cy="0" rx="10" ry="40" fill="#00e5ff" opacity="0.6"/>
  </g>

  <!-- Right Orange/Purple Portal -->
  <g transform="translate(470, 180) rotate(15)">
    <ellipse cx="0" cy="0" rx="42" ry="92" fill="#ff6b00" opacity="0.18" filter="url(#tp-glow)"/>
    <ellipse cx="0" cy="0" rx="34" ry="80" fill="none" stroke="#ff6b00" stroke-width="6" filter="url(#tp-glow)"/>
    <ellipse cx="0" cy="0" rx="22" ry="64" fill="#240c06"/>
    <ellipse cx="0" cy="0" rx="10" ry="40" fill="#ff6b00" opacity="0.6"/>
  </g>

  <!-- Connecting Quantum Laser Arc -->
  <path d="M170 180 Q320 80 470 180" fill="none" stroke="#ffeb3b" stroke-width="3" stroke-dasharray="8 6" opacity="0.75" filter="url(#tp-glow)"/>
  <path d="M170 180 Q320 110 470 180" fill="none" stroke="#00e5ff" stroke-width="2" opacity="0.6"/>

  <!-- Floating Puzzle Cube -->
  <g transform="translate(320, 130)">
    <!-- Cube faces -->
    <polygon points="0,-28 26,-14 0,0 -26,-14" fill="#ffd84a" stroke="#ffffff" stroke-width="2"/>
    <polygon points="-26,-14 0,0 0,30 -26,16" fill="#ca6cff" stroke="#ffffff" stroke-width="2"/>
    <polygon points="0,0 26,-14 26,16 0,30" fill="#7a22cc" stroke="#ffffff" stroke-width="2"/>
    <circle cx="0" cy="-7" r="4" fill="#ff2a2a"/>
  </g>

  <!-- Floating Abstract Puzzle Blocks -->
  <rect x="90" y="240" width="38" height="38" fill="#1b1733" stroke="#00e5ff" stroke-width="3"/>
  <rect x="510" y="230" width="44" height="44" fill="#261726" stroke="#ff6b00" stroke-width="3"/>
  <rect x="250" y="260" width="30" height="30" fill="#17122b" stroke="#ca6cff" stroke-width="2"/>
  <rect x="370" y="260" width="30" height="30" fill="#17122b" stroke="#ca6cff" stroke-width="2"/>

  <!-- HUD Reticle Elements -->
  <path d="M40 30 h30 v6 M600 30 h-30 v6 M40 330 h30 v-6 M600 330 h-30 v-6" stroke="#ca6cff" stroke-width="2" fill="none" opacity="0.5"/>
  <text x="50" y="55" font-family="'Courier New', monospace" font-size="12" fill="#00e5ff" letter-spacing="2">SYS.TELEPORT // 2D PUZZLE</text>
  <text x="590" y="55" font-family="'Courier New', monospace" font-size="12" fill="#ffeb3b" text-anchor="end" letter-spacing="2">ROOM [01]</text>
</svg>
